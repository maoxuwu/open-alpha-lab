[project]
name = "open-alpha-lab"
version = "0.1.0"
description = "Disciplined cross-sectional research on open data: hypothesis registry, DSR screening, death ledger"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
    "matplotlib>=3.7",
    "lxml>=4.9",
    "pyarrow>=14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oal"]
